# Dependabot: the versions of GitHub's actions that the workflows use, every Monday, as pull
# requests (docs/Workflow.md of roccobot.github.io, '🔗 Il controllo settimanale delle
# dipendenze'). Each one is read before it is merged.
# Author: Rocco Casadei, a.k.a. Roccobot
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Rome
