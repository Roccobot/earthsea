# Every Monday, the dependencies in docs/Dependencies.json (esbuild, which the minify workflow
# installs) against their latest versions: a newer one opens the issue 'Dipendenze da leggere'.
# The logic and the script are the site's (roccobot.github.io), like rules-check; since
# 2026-10-15 (Rocco's answer F1a).
# Author: Rocco Casadei, a.k.a. Roccobot
name: dependencies

on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays at 06:17 UTC: 08:17 in Rome in summer, 07:17 in winter
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    uses: Roccobot/roccobot.github.io/.github/workflows/dependencies.yml@master
