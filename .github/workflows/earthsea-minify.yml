# Genera la pagina pubblicata di 'I Grandi di Terramare' (index.html) dal suo
# sorgente commentato (index.src.html), minificandola: i commenti erano il 61%
# del codice servito. Dalla 2.71 genera anche admin.js da admin.src.js. I sorgenti sono i
# soli file che si modificano.
#
# Dalla 2.82 genera anche app.js, lo script principale estratto dalla pagina e caricato
# differito (vedi minify.mjs). Il commit che produce è di github-actions[bot] e tocca i soli
# file generati: non riattiva
# questo workflow (il filtro sui percorsi lo esclude, e i push fatti col GITHUB_TOKEN non
# fanno partire altri workflow), ma fa partire il deploy di Pages come ogni push.
# Dalla 2.84 gira anche quando cambia dati.js: la pagina generata contiene l'elenco leggibile
# senza JavaScript, ricavato dai dati, e deve seguire i salvataggi admin del Worker.
name: Terramare, pagina minificata

on:
  push:
    branches: [main]
    paths:
      - 'index.src.html'
      - 'admin.src.js'
      - 'dati.js'
      - '.github/scripts/minify.mjs'
      - '.github/workflows/earthsea-minify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earthsea-minify
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa esbuild
        run: npm install --no-save --no-package-lock esbuild@0.28.2
      - name: Genera index.html
        run: node .github/scripts/minify.mjs .
      - name: Pubblica se è cambiato
        run: |
          if git diff --quiet -- index.html admin.js app.js && [ -z "$(git ls-files --others --exclude-standard admin.js app.js)" ]; then
            echo "index.html già allineato al sorgente"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.js app.js
          git commit -m 'Terramare: index.html rigenerato dal sorgente'
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
